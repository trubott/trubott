name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Trust contract guardrail (verify-no-pii)
        run: npm run verify-no-pii

      - name: Drizzle schema validity
        env:
          DATABASE_URL: postgresql://x:y@localhost:5432/z
        run: npx drizzle-kit check

      - name: Build
        env:
          NEXTAUTH_SECRET: build-only-placeholder-secret-1234567890
          DATABASE_URL: postgresql://x:y@localhost:5432/z
          GOOGLE_CLIENT_ID: build-id
          GOOGLE_CLIENT_SECRET: build-secret
          FINGERPRINT_PEPPER: build-only-placeholder-pepper-1234567890
          CARD_SIGNING_SECRET: build-only-placeholder-card-secret-1234567890
        run: npm run build
