services:
  app:
    build: .
    image: trustcard:local
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: postgresql://trustcard:trustcard@db:5432/trustcard
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      FINGERPRINT_PEPPER: ${FINGERPRINT_PEPPER}
      CARD_SIGNING_SECRET: ${CARD_SIGNING_SECRET}
      CARD_DEFAULT_TTL_MINUTES: ${CARD_DEFAULT_TTL_MINUTES:-30}
      PASSIVE_MIN_SESSIONS: ${PASSIVE_MIN_SESSIONS:-3}
      PASSIVE_MIN_DAYS: ${PASSIVE_MIN_DAYS:-2}

      # Apify / Bio Verification
      APIFY_TOKEN: ${APIFY_TOKEN}
      APIFY_LINKEDIN_ACTOR_ID: ${APIFY_LINKEDIN_ACTOR_ID}
      APIFY_INSTAGRAM_ACTOR_ID: ${APIFY_INSTAGRAM_ACTOR_ID}
      APIFY_REDDIT_ACTOR_ID: ${APIFY_REDDIT_ACTOR_ID}
      APIFY_TWITTER_ACTOR_ID: ${APIFY_TWITTER_ACTOR_ID}
      APIFY_RUN_MAX_WAIT_MS: ${APIFY_RUN_MAX_WAIT_MS:-120000}
      VERIFY_SCRAPE_MIN_INTERVAL_MS: ${VERIFY_SCRAPE_MIN_INTERVAL_MS:-15000}

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}

      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_TRUST_HOST: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustcard
      POSTGRES_PASSWORD: trustcard
      POSTGRES_DB: trustcard
    volumes:
      - trustcard_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustcard -d trustcard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trustcard_pgdata:
